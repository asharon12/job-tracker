<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1e1b2e"/>
  <!-- Briefcase handle -->
  <path d="M11.5 12V10.5C11.5 9.4 12.4 8.5 13.5 8.5h5c1.1 0 2 .9 2 2V12" stroke="#7A4520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Briefcase body -->
  <rect x="5.5" y="12" width="21" height="13.5" rx="2.5" fill="#A0622D"/>
  <!-- Leather highlight (top sheen) -->
  <rect x="5.5" y="12" width="21" height="4" rx="2.5" fill="#C47A3A" fill-opacity="0.6"/>
  <!-- Center band / stitching line -->
  <rect x="5.5" y="17.5" width="21" height="2" fill="#7A4520" fill-opacity="0.5"/>
  <!-- Clasp (brass/gold) -->
  <rect x="14" y="16.5" width="4" height="4" rx="1" fill="#D4A94A"/>
  <!-- Clasp shine -->
  <rect x="14.5" y="17" width="1.5" height="1.2" rx="0.3" fill="#F0CB72" fill-opacity="0.8"/>
</svg>
